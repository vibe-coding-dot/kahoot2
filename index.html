<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizNight</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:#46178f;color:#fff;min-height:100vh}
#app{max-width:1000px;margin:auto;padding:16px}
button,input,select,textarea{font:inherit;border-radius:6px;border:0;padding:10px 14px}
button{background:#fff;color:#333;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #0003}
button:disabled{opacity:.4}
button.p{background:#26890c;color:#fff}button.d{background:#e21b3c;color:#fff}
input,select,textarea{background:#fff;color:#222;width:100%}
:focus-visible{outline:3px solid #ffd02b}
.card{background:#fff2;border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.big{font-size:clamp(40px,10vw,90px);font-weight:800;text-align:center}
.c{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:90px;font-size:1.3em;color:#fff;display:flex;align-items:center;gap:10px;padding:14px;border-radius:6px;font-weight:700;box-shadow:none}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.dim{opacity:.3}
.media{max-width:100%;max-height:40vh;display:block;margin:10px auto;border-radius:8px}
iframe.media{width:min(100%,640px);height:360px;border:0}
.pill{display:inline-block;background:#fff3;padding:6px 12px;border-radius:20px;margin:3px}
.sh{font-size:1.6em}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),SH=['▲','◆','●','■'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lib=()=>{
  if(!localStorage.qzs&&localStorage.qz){
    const m=[{id:1,...JSON.parse(localStorage.qz)}];
    try{localStorage.qzs=JSON.stringify(m);localStorage.removeItem('qz')}catch(e){return m}
  }
  return JSON.parse(localStorage.qzs||'[]');
};
const savelib=l=>localStorage.qzs=JSON.stringify(l);
let cur;
const load=()=>lib().find(x=>x.id==cur)||{title:'My Quiz',qs:[]};
const view=h=>app.innerHTML=h;
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();

function mediaHTML(m){
  if(!m||!m.src)return'';
  const s=m.src;
  if(m.type=='video'){
    const y=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return y?`<iframe class="media" src="https://www.youtube.com/embed/${y[1]}?autoplay=1&rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`
      :`<video class="media" src="${esc(s)}" autoplay controls playsinline></video>`;
  }
  if(m.type=='audio')return`<audio src="${esc(s)}" autoplay controls style="width:100%;margin:10px 0"></audio>`;
  if(m.type=='image')return`<img class="media" src="${esc(s)}">`;
  return'';
}

/* ---------- home ---------- */
function home(){
  view(`<h1 class=c>🎉 QuizNight</h1>
  <div class=card><b>Join a game</b><br><br>
  <input id=pin placeholder="Game PIN" inputmode=numeric value="${esc(location.hash.slice(1))}"><br><br>
  <input id=nm placeholder="Nickname" maxlength=16><br><br>
  <button class=p style="width:100%" onclick="join()">Enter</button></div>
  <div class=card><button style="width:100%" onclick="quizzes()">My quizzes: host or edit</button></div>`);
}

/* ---------- editor ---------- */
let Q;
function edit(){
  Q=load();
  view(`<h1>Quiz editor</h1>
  <div class=card><input id=t value="${esc(Q.title)}" placeholder="Quiz title"></div>
  <div id=qs></div>
  <div class=row><button onclick="addQ()">+ Question</button><button onclick="addQ(1)">+ True / False</button><button onclick="addQ(2)">+ Write answer</button></div><br>
  <div class=row><button onclick="exp()">Export quiz</button><button onclick="quizzes()">Cancel</button><button class=p onclick="done()">Save &amp; back</button></div>`);
  draw();
}
function addQ(tf){
  Q.qs.push({text:'',m:{type:'none',src:''},o:tf==1?['True','False','','']:['','','',''],c:0,time:20,pts:1,...(tf==2?{type:'text',acc:''}:{})});draw();
}
function draw(){
  $('#qs').innerHTML=Q.qs.map((q,i)=>`<div class=card><b>Question ${i+1}</b>
  <button class=d style="float:right" onclick="Q.qs.splice(${i},1);draw()">Delete</button><button style="float:right;margin-right:8px" onclick="prev(${i})">Preview</button><br><br>
  <textarea rows=2 placeholder="Question" oninput="Q.qs[${i}].text=this.value">${esc(q.text)}</textarea>
  <div class=row style="margin:8px 0">
    <select onchange="Q.qs[${i}].m.type=this.value;draw()">${['none','image','video','audio'].map(t=>`<option ${q.m.type==t?'selected':''}>${t}</option>`).join('')}</select>
    ${q.m.type!='none'?`<input style="flex:3" placeholder="${q.m.src.startsWith('data:')?'Uploaded image ✓ (type a URL to replace)':'URL, YouTube link, or repo path like media/clip.mp4'}" value="${q.m.src.startsWith('data:')?'':esc(q.m.src)}" oninput="Q.qs[${i}].m.src=this.value">`:''}
    ${q.m.type=='image'?`<input type=file accept="image/*" onchange="up(${i},this.files[0])">`:''}
  </div>
  ${q.type=='text'?`<input placeholder="Accepted answers, separated by ; (e.g. Paris; Paris France)" value="${esc(q.acc)}" oninput="Q.qs[${i}].acc=this.value"><p style="margin:6px 0">Players type their answer. Capitals, accents and punctuation are ignored.</p>`:`<div class=grid>${[0,1,2,3].map(j=>`<div class="row c${j}" style="padding:8px;border-radius:6px;flex-wrap:nowrap"><span class=sh style="flex:0 0 30px">${SH[j]}</span>
    <input placeholder="Answer ${j+1}${j>1?' (optional)':''}" value="${esc(q.o[j])}" oninput="Q.qs[${i}].o[${j}]=this.value">
    <input type=radio name=r${i} title="Correct answer" ${q.c==j?'checked':''} onchange="Q.qs[${i}].c=${j}" style="flex:0 0 22px;width:22px"></div>`).join('')}</div>`}
  <div class=row style="margin-top:8px"><label>Seconds <select onchange="Q.qs[${i}].time=+this.value">${[5,10,20,30,60,90].map(t=>`<option ${q.time==t?'selected':''}>${t}</option>`).join('')}</select></label>
  <label>Points <select onchange="Q.qs[${i}].pts=+this.value">${[[1,'Standard'],[2,'Double'],[0,'No points']].map(([v,n])=>`<option value=${v} ${q.pts==v?'selected':''}>${n}</option>`).join('')}</select></label></div></div>`).join('')
  ||'<div class=card>No questions yet. Add your first one.</div>';
}
function prev(i){
  const q=Q.qs[i],t=q.type=='text',ch=q.o.map((x,k)=>[x,k]).filter(x=>x[0].trim());
  const bad=!q.text.trim()||(t?!(q.acc||'').trim():ch.length<2||!(q.o[q.c]||'').trim());
  const d=document.createElement('div');d.id='pv';
  d.style.cssText='position:fixed;inset:0;background:#46178f;overflow:auto;z-index:9;padding:16px';
  d.innerHTML=`<div style="max-width:1000px;margin:auto">
  <div class=row><button onclick="$('#pv').remove()">✕ Close preview</button><div class=big style="flex:0 0 130px">${q.time}</div></div>
  ${bad?`<div class=card style="background:#e21b3c">⚠️ Incomplete: this question is skipped when hosting. It needs question text and ${t?'at least one accepted answer.':'two or more answers with a correct one selected.'}</div>`:''}
  <h1 class=c style="font-size:clamp(24px,5vw,44px)">${esc(q.text)||'(no question text yet)'}</h1>${mediaHTML(q.m)}
  ${t?`<h2 class=c>✍️ Type your answer on your phone</h2><div class=card>Accepted: ${esc((q.acc||'').split(';').map(s=>s.trim()).filter(Boolean).join(' / ')||'(none yet)')}</div>`
  :`<div class=grid>${ch.map(([x,k],n)=>`<div class="opt c${n}"><span class=sh>${SH[n]}</span>${esc(x)}${k==q.c?'<b style="margin-left:auto">✓ correct</b>':''}</div>`).join('')}</div>`}
  <h2 class=c style="margin-top:28px">On players' phones</h2>
  <div style="max-width:360px;margin:auto">${t?`<input placeholder="Type your answer" style="font-size:1.4em;margin:8px 0"><button class=p style="width:100%;font-size:1.4em">Send</button>`
  :`<div class=grid>${ch.map((_,n)=>`<div class="opt c${n}" style="justify-content:center;font-size:3em;min-height:80px">${SH[n]}</div>`).join('')}</div>`}</div>
  <p class=c style="opacity:.7">Question text and image show on phones only if "Show question and image on players' phones" is ticked in the lobby.</p></div>`;
  document.body.appendChild(d);
}
function up(i,f){
  if(!f)return;
  const im=new Image;
  im.onload=()=>{
    const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    Q.qs[i].m.src=c.toDataURL('image/jpeg',.75);draw();
  };
  im.src=URL.createObjectURL(f);
}
function done(){
  Q.title=$('#t').value;
  try{const l=lib(),k=l.findIndex(x=>x.id==Q.id);if(k<0){Q.id=Date.now();l.push(Q)}else l[k]=Q;savelib(l)}catch(e){return alert('Browser storage is full. Use image URLs or files in your repo for some media.')}
  quizzes();
}
function exp(){
  Q.title=$('#t').value;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(Q)],{type:'application/json'}));
  a.download='quiz.json';a.click();
}
function imp(f){
  if(!f)return;
  f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.qs))throw 0;j.id=Date.now();const l=lib();l.push(j);savelib(l);quizzes()}catch(e){alert('That file is not a valid quiz.')}});
}

/* ---------- quiz library ---------- */
function quizzes(){
  const l=lib();
  view(`<h1>My quizzes</h1>
  ${l.map(q=>`<div class=card><b>${esc(q.title||'Untitled quiz')}</b> (${q.qs.length} question${q.qs.length==1?'':'s'})
  <div class=row style="margin-top:8px"><button class=p onclick="cur=${q.id};host()">Host</button><button onclick="cur=${q.id};edit()">Edit</button><button onclick="dup(${q.id})">Duplicate</button><button class=d onclick="del(${q.id})">Delete</button></div></div>`).join('')||'<div class=card>No quizzes yet. Create your first one.</div>'}
  <div class=row><button class=p onclick="cur=null;edit()">+ New quiz</button><button onclick="$('#imp').click()">Import quiz</button><button onclick="home()">Back</button></div>
  <input id=imp type=file accept=.json hidden onchange="imp(this.files[0])">`);
}
function dup(id){
  const l=lib(),q=l.find(x=>x.id==id);
  l.push({...q,id:Date.now(),title:q.title+' (copy)'});
  try{savelib(l)}catch(e){alert('Browser storage is full.')}
  quizzes();
}
function del(id){
  if(confirm('Delete this quiz? This cannot be undone.')){savelib(lib().filter(x=>x.id!=id));quizzes()}
}

/* ---------- host ---------- */
let P,players={},G,pin;
const snd=(p,m)=>{try{if(p.conn.open)p.conn.send(m)}catch(e){}};
const bc=m=>Object.values(players).forEach(p=>snd(p,m));
function host(){
  const qs=load().qs.map(q=>{
    if(q.type=='text')return{...q,o:[],c:-1};
    const ch=q.o.map((t,k)=>[t,k]).filter(x=>x[0].trim());
    return{...q,o:ch.map(x=>x[0]),c:ch.findIndex(x=>x[1]==q.c)};
  }).filter(q=>q.text.trim()&&(q.type=='text'?(q.acc||'').trim():q.o.length>1&&q.c>=0));
  if(!qs.length)return alert('Add at least one complete question first (text, two answers, one marked correct).');
  pin=String(Math.floor(1e5+Math.random()*9e5));
  G={qs,i:-1,phone:false,state:'lobby'};players={};
  P=new Peer('qznight-'+pin);
  P.on('open',lobby);
  P.on('error',e=>{if(e.type=='unavailable-id')return host();alert('Connection problem: '+e.type)});
  P.on('connection',c=>{
    c.on('data',d=>onHost(c,d));
    c.on('close',()=>{if(G.state=='lobby'){delete players[c.peer];lobby()}});
  });
}
function onHost(c,d){
  if(d.t=='join'){
    if(G.state!='lobby')return c.send({t:'err',m:'This game has already started.'});
    let n=String(d.name).trim().slice(0,16)||'Player',base=n,k=2;
    while(Object.values(players).some(p=>p.name==n))n=base+' '+k++;
    players[c.peer]={name:n,score:0,ans:null,conn:c};
    c.send({t:'ok'});lobby();
  }
  if(d.t=='w'){
    const p=players[c.peer],s=String(d.s).trim().slice(0,100);
    if(G.state!='q'||!p||p.ans!==null||G.qs[G.i].type!='text'||!s)return;
    p.ans=s;p.tm=Date.now()-G.t0;
    const ps=Object.values(players),n=ps.filter(x=>x.ans!==null).length;
    $('#cnt').textContent=n+' / '+ps.length+' answered';
    if(n==ps.length)endQ();
  }
  if(d.t=='a'){
    const p=players[c.peer];
    if(G.state!='q'||!p||p.ans!==null||!(d.c>=0&&d.c<G.qs[G.i].o.length))return;
    p.ans=d.c;p.tm=Date.now()-G.t0;
    const ps=Object.values(players),n=ps.filter(x=>x.ans!==null).length;
    $('#cnt').textContent=n+' / '+ps.length+' answered';
    if(n==ps.length)endQ();
  }
}
function lobby(){
  const url=location.origin+location.pathname+'#'+pin,n=Object.keys(players).length;
  view(`<div class="card c"><div>Go to <b>${esc(location.origin+location.pathname)}</b> and enter the PIN</div>
  <div class=big>${pin}</div>
  <img alt="QR code" width=160 height=160 style="background:#fff;padding:6px;border-radius:6px" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}"></div>
  <label><input type=checkbox style="width:auto" ${G.phone?'checked':''} onchange="G.phone=this.checked"> Show question and image on players' phones</label>
  <h2>${n} player${n==1?'':'s'}</h2><div>${Object.values(players).map(p=>`<span class=pill>${esc(p.name)}</span>`).join('')}</div><br>
  <button class=p onclick="nextQ()" ${n?'':'disabled'}>Start game</button>`);
}
function nextQ(){
  G.i++;
  if(G.i>=G.qs.length)return podium();
  const q=G.qs[G.i];G.state='q';
  Object.values(players).forEach(p=>{p.ans=null});
  G.t0=Date.now();
  bc({t:'q',w:q.type=='text',n:q.o.length,...(G.phone?{text:q.text,img:q.m.type=='image'?q.m.src:null}:{})});
  view(`<div class=row><div class=sh id=cnt>0 / ${Object.keys(players).length} answered</div><div class=big id=tm style="flex:0 0 130px">${q.time}</div></div>
  <h1 class=c style="font-size:clamp(24px,5vw,44px)">${esc(q.text)}</h1>${mediaHTML(q.m)}
  ${q.type=='text'?'<h2 class=c>✍️ Type your answer on your phone</h2>':''}<div class=grid>${q.o.map((o,k)=>`<div class="opt c${k}"><span class=sh>${SH[k]}</span>${esc(o)}</div>`).join('')}</div>`);
  clearInterval(G.iv);
  G.iv=setInterval(()=>{
    const left=Math.max(0,Math.ceil(q.time-(Date.now()-G.t0)/1000));
    $('#tm').textContent=left;if(!left)endQ();
  },250);
}
function endQ(){
  if(G.state!='q')return;
  G.state='r';clearInterval(G.iv);
  const q=G.qs[G.i],ps=Object.values(players);
  const cnt=q.o.map((_,k)=>ps.filter(p=>p.ans===k).length);
  ps.forEach(p=>{
    p.ok=q.type=='text'?p.ans!==null&&q.acc.split(';').some(a=>norm(a)&&norm(a)==norm(p.ans)):p.ans===q.c;
    p.pts=p.ok?Math.round(1000*(1-p.tm/(q.time*1000)/2))*q.pts:0;
    p.score+=p.pts;
  });
  const rk=ps.slice().sort((a,b)=>b.score-a.score);
  ps.forEach(p=>snd(p,{t:'r',ok:p.ok,na:p.ans===null,pts:p.pts,score:p.score,rank:rk.indexOf(p)+1,of:ps.length}));
  view(`<h2 class=c>${esc(q.text)}</h2>
  <div class=grid>${q.o.map((o,k)=>`<div class="opt c${k} ${k==q.c?'':'dim'}"><span class=sh>${k==q.c?'✓':SH[k]}</span>${esc(o)}<b style="margin-left:auto">${cnt[k]}</b></div>`).join('')}</div>
  ${q.type=='text'?`<div class=card><b>${ps.filter(p=>p.ok).length} correct.</b> Accepted: ${esc(q.acc.split(';').map(s=>s.trim()).filter(Boolean).join(' / '))}<br>${ps.filter(p=>p.ans!==null&&!p.ok).map(p=>`<span class=pill>${esc(p.ans)}</span>`).join('')}</div>`:''}
  <h2>Leaderboard</h2>${rk.slice(0,5).map((p,i)=>`<div class=card>${i+1}. ${esc(p.name)}<b style="float:right">${p.score}</b></div>`).join('')}
  <button class=p onclick="nextQ()">${G.i+1<G.qs.length?'Next question':'Final results'}</button>`);
}
function podium(){
  G.state='end';
  const rk=Object.values(players).sort((a,b)=>b.score-a.score);
  rk.forEach((p,i)=>snd(p,{t:'end',rank:i+1,score:p.score}));
  view(`<h1 class=c>🏆 Final results</h1>${rk.map((p,i)=>`<div class=card style="font-size:${i<3?'1.8em':'1em'}">${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(p.name)}<b style="float:right">${p.score}</b></div>`).join('')}
  <button onclick="location.hash='';location.reload()">Done</button>`);
}

/* ---------- player ---------- */
let C;
function join(){
  const pin=$('#pin').value.trim(),name=$('#nm').value.trim();
  if(!pin||!name)return alert('Enter the game PIN and a nickname.');
  view('<h2 class=c>Connecting…</h2>');
  let to;const bail=m=>{clearTimeout(to);alert(m);location.reload()};
  const p=new Peer();
  p.on('error',e=>bail(e.type=='peer-unavailable'?'Game not found. Check the PIN.':'Connection problem: '+e.type));
  p.on('open',()=>{
    C=p.connect('qznight-'+pin,{reliable:true});
    to=setTimeout(()=>bail('Could not connect to the game.'),12000);
    C.on('open',()=>{clearTimeout(to);C.send({t:'join',name})});
    C.on('data',onPlayer);
    C.on('close',()=>view('<h2 class=c>Disconnected</h2><p class=c><button onclick="location.reload()">Back</button></p>'));
  });
}
const ans=k=>{C.send({t:'a',c:k});view('<div class=big>✓</div><h2 class=c>Answer sent. Waiting for the others…</h2>')};
const sendW=()=>{const s=$('#wa').value.trim();if(!s)return;C.send({t:'w',s});view('<div class=big>✓</div><h2 class=c>Answer sent. Waiting for the others…</h2>')};
function onPlayer(d){
  if(d.t=='err')alert(d.m),location.reload();
  if(d.t=='ok')view('<div class=big>You\'re in!</div><h2 class=c>Look for your nickname on the big screen.</h2>');
  if(d.t=='q'&&d.w)view(`${d.text?`<h2 class=c>${esc(d.text)}</h2>`:''}${d.img?`<img class=media src="${esc(d.img)}">`:''}
    <input id=wa maxlength=100 autocomplete=off placeholder="Type your answer" onkeydown="if(event.key=='Enter')sendW()" style="font-size:1.4em;margin:14px 0"><button class=p style="width:100%;font-size:1.4em" onclick="sendW()">Send</button>`);
  if(d.t=='q'&&!d.w)view(`${d.text?`<h2 class=c>${esc(d.text)}</h2>`:''}${d.img?`<img class=media src="${esc(d.img)}">`:''}
    <div class=grid style="grid-auto-rows:minmax(110px,24vh)">${Array.from({length:d.n},(_,k)=>`<button class="opt c${k}" aria-label="Answer ${k+1}" style="justify-content:center;font-size:3em" onclick="ans(${k})">${SH[k]}</button>`).join('')}</div>`);
  if(d.t=='r')view(`<div class=big>${d.na?'⏱ Too slow':d.ok?'✅ Correct':'❌ Wrong'}</div>
    <h2 class=c>+${d.pts} points</h2><p class=c>Rank ${d.rank} of ${d.of} · ${d.score} points</p>`);
  if(d.t=='end')view(`<div class=big>🏆 #${d.rank}</div><h2 class=c>${d.score} points</h2><p class=c>Thanks for playing!</p>`);
}
home();
</script></body></html>
